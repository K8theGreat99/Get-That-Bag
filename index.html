<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get That Bag</title>
<meta name="description" content="Track what you earn against what's due. Runs entirely in your browser.">
<meta name="theme-color" content="#1B1E24">
<meta name="color-scheme" content="dark light">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Get That Bag">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header>
  <div class="brandrow">
    <h1 class="brand">Get That Bag</h1>
    <div class="status" id="status"></div>
  </div>

  <div class="stepper" id="stepper">
    <button id="prevM" aria-label="Previous month">&lsaquo;</button>
    <div class="monthlabel" id="monthLabel"></div>
    <button id="nextM" aria-label="Next month">&rsaquo;</button>
    <button class="today-btn" id="todayBtn" hidden>Now</button>
  </div>

  <nav class="tabs" role="tablist" aria-label="Screens">
    <button role="tab" data-view="flow" aria-selected="true">Flow</button>
    <button role="tab" data-view="ledger" aria-selected="false">Ledger</button>
    <button role="tab" data-view="bills" aria-selected="false">Bills</button>
    <button role="tab" data-view="settings" aria-selected="false">Settings</button>
  </nav>
</header>

<main id="main">
  <section class="panel"><div class="empty"><b>Loading</b></div></section>
</main>

<button class="fab" id="fab" aria-label="Add an entry">+ Add</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Dialog"></div>

<!-- Stacks above the sheet so a rejected entry keeps everything already typed. -->
<div class="alertscrim" id="alertScrim" hidden>
  <div class="alertbox" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle" aria-describedby="alertBody">
    <h3 id="alertTitle"></h3>
    <p id="alertBody"></p>
    <button class="btn primary" id="alertOk">Got it</button>
  </div>
</div>

<div class="toastbar" id="toast" role="status" aria-live="polite"></div>

<div class="updatebar" id="update" hidden>
  <span>A new version is ready.</span><button>Reload</button>
</div>

<noscript>
  <p style="padding:24px;font:16px system-ui">Get That Bag needs JavaScript — the whole app runs in your browser.</p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
